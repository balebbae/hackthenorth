[project]
name = "wander-backend"
version = "0.1.0"
description = "Wander worlds backend: FastAPI on Modal fronting the worlds Volume, plus the ACE-based visual positioning (mapping + 6DoF localization) service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "torch>=2.2",
    "poselib>=2.0",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["app", "deployment"]
explicit_package_bases = true
