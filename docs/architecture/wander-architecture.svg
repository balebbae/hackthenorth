      <rect x="548" y="374" width="28" height="12" rx="2" fill="#475569"/>
      <text x="562" y="383" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" font-weight="500" letter-spacing="0.18em" fill="#f8fafc">GPU</text>
      <text x="612" y="406" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Modal workers</text>
      <text x="612" y="422" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">hloc localize · annotate</text>

      <!-- Companion web app -->
      <rect x="756" y="208" width="180" height="112" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
      <rect x="764" y="214" width="28" height="12" rx="2" fill="#0f172a"/>
      <text x="778" y="223" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" font-weight="500" letter-spacing="0.18em" fill="#f8fafc">WEB</text>
      <text x="846" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Companion web app</text>
      <text x="846" y="274" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">Next.js · Spark viewer</text>
      <text x="846" y="288" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" fill="#475569">graph · notes · live · QR</text>

      <!-- ═══ LEGEND ═══ -->
      <line x1="20" y1="496" x2="936" y2="496" stroke="#0f172a" stroke-opacity="0.08" stroke-width="1"/>

      <rect x="20" y="512" width="12" height="12" rx="2" fill="#fbe4f0" stroke="#d85598" stroke-width="1.5"/>
      <text x="40" y="521" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">GUIDANCE COORDINATOR</text>

      <rect x="180" y="512" width="12" height="12" rx="2" fill="#0f172a" fill-opacity="0.05" stroke="#475569" stroke-width="1"/>
      <text x="200" y="521" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">PERSISTENT STORE</text>

      <rect x="316" y="512" width="12" height="12" rx="2" fill="#0f172a" fill-opacity="0.03" stroke="#0f172a" stroke-opacity="0.30" stroke-width="1"/>
      <text x="336" y="521" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">EXTERNAL SERVICE</text>

      <rect x="452" y="512" width="12" height="12" rx="2" fill="#0f172a" fill-opacity="0.02" stroke="#0f172a" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3 2"/>
      <text x="472" y="521" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">OPTIONAL</text>

      <line x1="560" y1="518" x2="588" y2="518" stroke="#2e4885" stroke-width="1.5" marker-end="url(#wander-arch-arrow-link)"/>
      <text x="596" y="521" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">HTTPS / WSS</text>

      <line x1="688" y1="518" x2="716" y2="518" stroke="#475569" stroke-width="1.5" marker-end="url(#wander-arch-arrow)"/>
      <text x="724" y="521" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">LOCAL / IN-PROCESS</text>

      <line x1="832" y1="518" x2="860" y2="518" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#wander-arch-arrow)"/>
      <text x="868" y="521" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">RETURN / OPT</text>
    </svg>
