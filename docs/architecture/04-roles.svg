      <title id="wander-roles-title">Wander phone roles</title>
      <desc id="wander-roles-desc">Top-down view of the wearer with four iPhones. The chest phone is the single coordinator: it sees, speaks and decides. Left, right and back phones only vibrate, receiving cues over a Multipeer link.</desc>
