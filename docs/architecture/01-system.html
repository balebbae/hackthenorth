    .frame { max-width: 1040px; width: 100%; }

               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>

      <desc id="wander-system-desc">A front iPhone on the chest runs LiDAR obstacle detection, Niantic localization, speech and haptics, and fans haptic cues to three side and back phones. It talks to one FastAPI backend on Modal over REST and WebSockets; the backend owns routing, sessions and the OpenAI agent and voice bridge, stores worlds on a Modal Volume, and can call optional GPU workers. A Next.js companion web app reaches the backend through a server-side proxy.</desc>
