      <line x1="316" y1="424" x2="104" y2="424" stroke="#475569" stroke-width="1.5" marker-end="url(#wander-seq-arrow)"/>
      <rect x="172" y="404" width="76" height="12" fill="#f8fafc"/>
      <text x="210" y="413" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">SPEAK + BUZZ</text>
      <path d="M 564 292 L 604 292 L 604 308 L 566 308" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#wander-seq-arrow)"/>
      <rect x="612" y="294" width="36" height="12" fill="#f8fafc"/>
      <text x="616" y="303" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">ROUTE</text>
