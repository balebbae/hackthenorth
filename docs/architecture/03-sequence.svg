      <line x1="20" y1="510" x2="48" y2="510" stroke="#2e4885" stroke-width="1.5" marker-end="url(#wander-seq-arrow-link)"/>
      <text x="56" y="513" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">HTTPS</text>
      <line x1="112" y1="510" x2="140" y2="510" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#wander-seq-arrow)"/>
      <text x="148" y="513" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">RETURN / TOOL CALL</text>
      <line x1="276" y1="510" x2="304" y2="510" stroke="#d85598" stroke-width="1.5" marker-end="url(#wander-seq-arrow-accent)"/>
      <text x="312" y="513" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">GUIDANCE</text>
      <rect x="384" y="504" width="12" height="12" rx="2" fill="#fbe4f0" stroke="#d85598" stroke-width="1.5"/>
      <text x="404" y="513" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">COORDINATOR</text>
    </svg>
