      <text x="800" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">OpenAI</text>
      <rect x="316" y="136" width="8" height="288" fill="#0f172a" fill-opacity="0.06" stroke="#475569" stroke-width="0.8"/>
