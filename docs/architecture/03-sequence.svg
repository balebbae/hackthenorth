      <text x="100" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Wearer</text>
      <line x1="320" y1="104" x2="320" y2="456" stroke="#0f172a" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="248" y="48" width="144" height="48" rx="4" fill="#fbe4f0" stroke="#d85598" stroke-width="1.5"/>
      <text x="320" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Front phone</text>
      <line x1="560" y1="104" x2="560" y2="456" stroke="#0f172a" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="488" y="48" width="144" height="48" rx="4" fill="#fbe4f0" stroke="#d85598" stroke-width="1.5"/>
      <text x="560" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Backend</text>
      <line x1="800" y1="104" x2="800" y2="456" stroke="#0f172a" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3 3"/>
