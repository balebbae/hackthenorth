<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wander-seq-title wander-seq-desc" font-family="'Inter', system-ui, sans-serif">
      <title id="wander-seq-title">Wander destination request sequence</title>
      <desc id="wander-seq-desc">The wearer asks the front phone for room 101. The phone posts audio to the backend, which calls the OpenAI Responses API. The model calls resolve_destination and set_destination tools; the backend routes over the graph and starts a session, then returns the answer. The backend sends the route and first cue to the phone, which speaks and vibrates.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="wander-seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
        </marker>
        <marker id="wander-seq-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e4885"/>
        </marker>
        <marker id="wander-seq-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85598"/>
        </marker>
        <marker id="wander-seq-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#475569" stroke-width="1.2"/>
        </marker>
      </defs>
