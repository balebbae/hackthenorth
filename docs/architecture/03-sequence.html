<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wander destination request sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz@0,8..60;1,8..60&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f8fafc; /* Stellar White */
      --color-ink:    #0f172a; /* Void Black */
      --color-muted:  #475569; /* Graphite */
      --color-accent: #d85598; /* Wander Pink */
      --font-sans:  'Inter', system-ui, sans-serif;
      --font-serif: 'Source Serif 4', 'Source Serif Pro', Georgia, serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 720px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Wander</p>
    <h1>Ask for a place, get a route</h1>
    <svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wander-seq-title wander-seq-desc" font-family="'Inter', system-ui, sans-serif">
      <title id="wander-seq-title">Wander destination request sequence</title>
      <desc id="wander-seq-desc">The wearer asks the front phone for room 101. The phone posts audio to the backend, which calls the OpenAI Responses API. The model calls resolve_destination and set_destination tools; the backend routes over the graph and starts a session, then returns the answer. The backend sends the route and first cue to the phone, which speaks and vibrates.</desc>
      <defs>
        <marker id="wander-seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
        </marker>
        <marker id="wander-seq-arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e4885"/>
        </marker>
        <marker id="wander-seq-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#d85598"/>
        </marker>
        <marker id="wander-seq-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polyline points="0 0, 8 3, 0 6" fill="none" stroke="#475569" stroke-width="1.2"/>
        </marker>
      </defs>
      <rect width="960" height="536" fill="#f8fafc"/>
      <line x1="100" y1="104" x2="100" y2="456" stroke="rgba(15,23,42,0.20)" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="28" y="48" width="144" height="48" rx="4" fill="rgba(71,85,105,0.10)" stroke="#64748b" stroke-width="1"/>
      <text x="100" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Wearer</text>
      <line x1="320" y1="104" x2="320" y2="456" stroke="rgba(15,23,42,0.20)" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="248" y="48" width="144" height="48" rx="4" fill="#fbe4f0" stroke="#d85598" stroke-width="1.5"/>
      <text x="320" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Front phone</text>
      <line x1="560" y1="104" x2="560" y2="456" stroke="rgba(15,23,42,0.20)" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="488" y="48" width="144" height="48" rx="4" fill="#fbe4f0" stroke="#d85598" stroke-width="1.5"/>
      <text x="560" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Backend</text>
      <line x1="800" y1="104" x2="800" y2="456" stroke="rgba(15,23,42,0.20)" stroke-width="1" stroke-dasharray="3 3"/>
      <rect x="728" y="48" width="144" height="48" rx="4" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
      <text x="800" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">OpenAI</text>
      <rect x="316" y="136" width="8" height="288" fill="rgba(15,23,42,0.06)" stroke="#475569" stroke-width="0.8"/>
      <rect x="556" y="176" width="8" height="216" fill="rgba(15,23,42,0.06)" stroke="#475569" stroke-width="0.8"/>
      <rect x="796" y="216" width="8" height="128" fill="rgba(15,23,42,0.06)" stroke="#475569" stroke-width="0.8"/>
      <line x1="100" y1="136" x2="316" y2="136" stroke="#475569" stroke-width="1.5" marker-end="url(#wander-seq-arrow)"/>
      <rect x="176" y="116" width="64" height="12" fill="#f8fafc"/>
      <text x="208" y="125" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">"ROOM 101"</text>
      <line x1="324" y1="176" x2="556" y2="176" stroke="#2e4885" stroke-width="1.5" marker-end="url(#wander-seq-arrow-link)"/>
      <rect x="422" y="156" width="36" height="12" fill="#f8fafc"/>
      <text x="440" y="165" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">AUDIO</text>
      <line x1="564" y1="216" x2="796" y2="216" stroke="#2e4885" stroke-width="1.5" marker-end="url(#wander-seq-arrow-link)"/>
      <rect x="636" y="196" width="88" height="12" fill="#f8fafc"/>
      <text x="680" y="205" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">PROMPT + TOOLS</text>
      <line x1="796" y1="256" x2="564" y2="256" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#wander-seq-arrow)"/>
      <rect x="634" y="236" width="92" height="12" fill="#f8fafc"/>
      <text x="680" y="245" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">SET_DESTINATION</text>
      <line x1="796" y1="344" x2="564" y2="344" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#wander-seq-arrow)"/>
      <rect x="658" y="324" width="44" height="12" fill="#f8fafc"/>
      <text x="680" y="333" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">ANSWER</text>
      <line x1="556" y1="392" x2="324" y2="392" stroke="#d85598" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#wander-seq-arrow-accent)"/>
      <rect x="404" y="372" width="72" height="12" fill="#f8fafc"/>
      <text x="440" y="381" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">ROUTE + CUE</text>
      <line x1="316" y1="424" x2="104" y2="424" stroke="#475569" stroke-width="1.5" marker-end="url(#wander-seq-arrow)"/>
      <rect x="172" y="404" width="76" height="12" fill="#f8fafc"/>
      <text x="210" y="413" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">SPEAK + BUZZ</text>
      <path d="M 564 292 L 604 292 L 604 308 L 566 308" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#wander-seq-arrow)"/>
      <rect x="612" y="294" width="36" height="12" fill="#f8fafc"/>
      <text x="616" y="303" text-anchor="start" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">ROUTE</text>
      <line x1="20" y1="488" x2="936" y2="488" stroke="rgba(15,23,42,0.08)" stroke-width="1"/>
      <line x1="20" y1="510" x2="48" y2="510" stroke="#2e4885" stroke-width="1.5" marker-end="url(#wander-seq-arrow-link)"/>
      <text x="56" y="513" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">HTTPS</text>
      <line x1="112" y1="510" x2="140" y2="510" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#wander-seq-arrow)"/>
      <text x="148" y="513" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">RETURN / TOOL CALL</text>
      <line x1="276" y1="510" x2="304" y2="510" stroke="#d85598" stroke-width="1.5" marker-end="url(#wander-seq-arrow-accent)"/>
      <text x="312" y="513" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">GUIDANCE</text>
      <rect x="384" y="504" width="12" height="12" rx="2" fill="#fbe4f0" stroke="#d85598" stroke-width="1.5"/>
      <text x="404" y="513" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" letter-spacing="0.06em" fill="#475569">COORDINATOR</text>
    </svg>
  </div>
</body>
</html>
